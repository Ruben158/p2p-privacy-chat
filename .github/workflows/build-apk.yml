name: Build and publish debug APK & Web bundle

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_DOMAIN: "localhost"
      NODE_OPTIONS: "--max-old-space-size=4096"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Web Bundle & Sync Android
        run: |
          cd artifacts/p2p-messenger
          npx expo export --platform web --output-dir dist
          if [ ! -d "android" ]; then
            npx @capacitor/cli add android
          fi
          npx @capacitor/cli sync android

      - name: Build APK with Gradle
        run: |
          cd artifacts/p2p-messenger/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: artifacts/p2p-messenger/android/app/build/outputs/apk/debug/app-debug.apk
