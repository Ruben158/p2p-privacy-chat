name: Build Android APK

on:
  workflow_call:

permissions:
  contents: write

jobs:
  build-android:
    name: Build and publish debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android platform tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" \
            "platforms;android-34" "build-tools;34.0.0" \
            "platforms;android-35" "build-tools;35.0.0"

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Export the Expo web app
        run: pnpm --filter @workspace/p2p-messenger run build:web

      - name: Create the Capacitor Android project
        run: pnpm --filter @workspace/p2p-messenger run cap:add:android

      - name: Sync the web app and add camera/audio permissions
        working-directory: artifacts/p2p-messenger
        run: |
          pnpm run cap:sync:android
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          contents = manifest.read_text()
          marker = "    <application"
          permissions = [
              '    <uses-permission android:name="android.permission.INTERNET" />',
              '    <uses-permission android:name="android.permission.CAMERA" />',
              '    <uses-permission android:name="android.permission.RECORD_AUDIO" />',
              '    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />',
              '    <uses-feature android:name="android.hardware.camera" android:required="false" />',
          ]
          for line in permissions:
              if line not in contents:
                  contents = contents.replace(marker, line + "\n" + marker, 1)
          manifest.write_text(contents)
          PY

      - name: Build app-debug.apk
        working-directory: artifacts/p2p-messenger/android
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: artifacts/p2p-messenger/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to GitHub Releases
        if: github.event.repository.fork == false
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_id }}
          name: Android debug build ${{ github.run_number }}
          prerelease: true
          generate_release_notes: false
          files: artifacts/p2p-messenger/android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
