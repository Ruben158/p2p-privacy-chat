name: Build and publish debug APK & Web bundle

on:
  push:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.15.0
          run_install: false

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install root dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Web Bundle & Android APK
        run: |
          cd artifacts/p2p-messenger
          pnpm --config.verify-deps-before-run=false run build:web
          npx @capacitor/cli sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: artifacts/p2p-messenger/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/p2p-messenger/android/app/build/outputs/apk/debug/app-debug.apk
          tag_name: latest
          overwrite: true
          body: "Automated P2P Privacy Messenger Android Build with fixes."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
