name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8.15.0
          run_install: false

      - name: Install All Dependencies (Root & Workspaces)
        run: pnpm install --no-frozen-lockfile

      - name: Build Web Bundle & Sync Android
        run: |
          cd artifacts/p2p-messenger
          npx expo export --platform web --output-dir dist
          npx @capacitor/cli sync android

      - name: Build APK with Gradle
        run: |
          cd artifacts/p2p-messenger/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: artifacts/p2p-messenger/android/app/build/outputs/apk/debug/app-debug.apk
