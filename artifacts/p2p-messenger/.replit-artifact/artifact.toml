kind = "mobile"
previewPath = "/"
title = "P2P Messenger"
description = "An Android-first, privacy-focused peer-to-peer messenger with locally stored identities and chats, encrypted direct connections, QR contact exchange, and a Capacitor APK build workflow."
version = "1.0.0"
id = "artifacts/p2p-messenger"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 24612

[services.development]
run = "pnpm --filter @workspace/p2p-messenger run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/p2p-messenger", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/p2p-messenger", "run", "serve" ]

[services.env]
PORT = "24612"
BASE_PATH = "/"
